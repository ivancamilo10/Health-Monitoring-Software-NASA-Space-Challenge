<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="minsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0B3D91"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexágono Exterior de Soporte Vital -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           stroke="url(#minsGrad)" stroke-width="3.5" fill="#090E17" filter="url(#glow)"/>

  <!-- Anillo Técnico Interior -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" 
           stroke="#172033" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- M Estilizada con Cruz Médica y Pulso Central -->
  <path d="M28 66 L28 36 L40 50 L50 38 L60 50 L72 36 L72 66" 
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulso Bioeléctrico en Cian -->
  <path d="M38 58 L44 58 L48 50 L52 64 L56 58 L62 58" 
        stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodo Central Luminoso -->
  <circle cx="50" cy="50" r="2.5" fill="#00E5FF" filter="url(#glow)"/>
</svg>
